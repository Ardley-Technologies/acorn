name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  java:
    name: Publish Java
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: java

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: ./gradlew build test --no-daemon

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  node:
    name: Publish Node.js
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: node

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@ardley-technologies:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > .npmrc
          for pkg in core roles express koa fastify lambda; do
            (cd "packages/$pkg" && bun publish)
          done
